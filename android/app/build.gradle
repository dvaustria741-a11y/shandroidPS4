apply plugin: 'com.android.application'

android {
    namespace 'org.shadps4.android'
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "org.shadps4.android"
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName "0.1-scaffold"

        externalNativeBuild {
            cmake {
                // Build the existing desktop CMake project directly, targeting Android.
                // The Qt GUI, updater and Discord RPC are desktop-only, so they're disabled here.
                arguments "-DENABLE_QT_GUI=OFF",
                          "-DENABLE_DISCORD_RPC=OFF",
                          "-DENABLE_UPDATER=OFF",
                          "-DCMAKE_BUILD_TYPE=Release"
                abiFilters "arm64-v8a"
            }
        }
    }

    externalNativeBuild {
        cmake {
            // Points at the project's existing root CMakeLists.txt (android/app -> repo root).
            path "../../CMakeLists.txt"
            version "3.22.1+"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
