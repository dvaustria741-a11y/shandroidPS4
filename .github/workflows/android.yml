name: Android APK Build

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'externals/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Init submodules (skip dead externals/cryptoppwin)
        run: |
          # externals/cryptoppwin (shadps4-emu/ext-cryptoppwin.git) no longer
          # exists upstream and is only linked for Clang+MSVC builds anyway,
          # which never applies here. Init everything else.
          git config --file .gitmodules --get-regexp path \
            | awk '{ print $2 }' \
            | grep -v '^externals/cryptoppwin$' \
            > /tmp/submodule-paths.txt
          xargs -a /tmp/submodule-paths.txt git submodule update --init --recursive --

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --stacktrace
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shadps4-android-apk
          path: android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
